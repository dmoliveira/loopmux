<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">loopmux hero banner</title>
  <desc id="desc">A stylized terminal-inspired gradient banner for loopmux.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="50%" stop-color="#0f2740"/>
      <stop offset="100%" stop-color="#163d2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57d3a4"/>
      <stop offset="100%" stop-color="#5bb5ff"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <circle cx="1130" cy="70" r="180" fill="#1f6d73" opacity="0.25"/>
  <circle cx="140" cy="300" r="190" fill="#1f3f66" opacity="0.35"/>

  <g opacity="0.3">
    <path d="M0 236 Q180 196 360 226 T720 218 T1280 246" fill="none" stroke="#7de1ff" stroke-width="2"/>
    <path d="M0 258 Q180 218 360 248 T720 240 T1280 268" fill="none" stroke="#68f0c9" stroke-width="2"/>
  </g>

  <g transform="translate(88,64)">
    <rect x="0" y="0" width="550" height="176" rx="14" fill="#050a14" opacity="0.92"/>
    <rect x="0" y="0" width="550" height="34" rx="14" fill="#0d1528"/>
    <circle cx="24" cy="17" r="6" fill="#ff6f7d"/>
    <circle cx="46" cy="17" r="6" fill="#ffd166"/>
    <circle cx="68" cy="17" r="6" fill="#51d88a"/>
    <text x="92" y="22" fill="#a2b6cf" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="13">loopmux run --config loop.yaml</text>

    <text x="24" y="74" fill="#57d3a4" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="16">trigger matched: &lt;CONTINUE-LOOP&gt;</text>
    <text x="24" y="106" fill="#d6e3f5" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="16">sending to ai:5.0 and codex:1.0...</text>
    <text x="24" y="138" fill="#8ed7ff" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="16">next scan in 00:05</text>
  </g>

  <g transform="translate(680,72)">
    <text x="0" y="38" fill="#f3f7ff" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="58" font-weight="700" filter="url(#softGlow)">loopmux</text>
    <rect x="0" y="58" width="430" height="4" fill="url(#accent)" rx="2"/>
    <text x="0" y="104" fill="#d7e8ff" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24">Prompt loops for tmux-based coding assistants</text>
    <text x="0" y="142" fill="#aad0e8" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19">Trigger-aware. Delay-controlled. Built for steady iteration.</text>
  </g>
</svg>
